
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Website Identity -->
    <meta name="application-name" content="Kailasam" />
    <meta property="og:site_name" content="Kailasam" />

    <!-- Google Website Name Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Kailasam",
        "alternateName": "Kailasam Portfolio",
        "url": "https://kailasamnportfolio.netlify.app/"
      }
    </script>

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Meta Tags -->
    <title>Kailasam | Web Developer Portfolio</title>
    <meta
      name="description"
      content="Welcome to Kailasam's Portfolio. Explore web development projects, skills, and creative work in front-end and full-stack development."
    />
    <meta
      name="keywords"
      content="Kailasam, Kailasam Portfolio, web developer, React developer, frontend developer, JavaScript, full-stack developer, web development projects"
    />
    <meta name="author" content="Kailasam" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://kailasamnportfolio.netlify.app/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Kailasam | Web Developer Portfolio" />
    <meta
      property="og:description"
      content="Explore Kailasam's web development projects, technical skills, and creative work."
    />
    <meta
      property="og:url"
      content="https://kailasamnportfolio.netlify.app/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kailasam" />
    <meta
      property="og:image"
      content="https://kailasamnportfolio.netlify.app/Preview-image.png"
    />
    <meta
      property="og:image:alt"
      content="Kailasam Web Developer Portfolio preview"
    />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kailasam | Web Developer Portfolio" />
    <meta
      name="twitter:description"
      content="Explore Kailasam's web development projects and creative skills."
    />
    <meta
      name="twitter:image"
      content="https://kailasamnportfolio.netlify.app/Preview-image.png"
    />

    <meta name="theme-color" content="#0F766E" />
  </head>

  <body>
    <!-- SEO: Visible to crawlers before JS loads -->
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">
      Kailasam N | Software Developer Portfolio
    </h1>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
